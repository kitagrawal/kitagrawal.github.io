name: Stripe newsletter sync

# Once a day, copy newsletter subscription statuses from Stripe into the Sheet.
# Setup: SETUP.md, section 4.
on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily; GitHub may start it a few minutes late
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: stripe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/stripe-sync.mjs
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          SHEET_SYNC_TOKEN: ${{ secrets.SHEET_SYNC_TOKEN }}
          NEWSLETTER_PRICE_ID: ${{ vars.NEWSLETTER_PRICE_ID }}
