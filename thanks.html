<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Ankit Agrawal(Kit)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <a class="logo" href="index.html">Ankit Agrawal<span>(Kit)</span></a>
      <div class="navlinks">
        <a href="index.html#letter">Letter</a>
        <a href="index.html#advisory">Advisory</a>
        <a href="index.html#work">Work</a>
      </div>
      <div class="links">
        <a class="pill" href="book.html">Book<span class="xs-hide"> a session</span></a>
        <a class="pill solid" href="subscribe.html">Subscribe</a>
        <button class="theme" id="theme" aria-label="Toggle theme"></button>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="page-hero">
    <div class="wrap">
      <span class="mono" id="kicker">Thank you</span>
      <h1 id="title">Thanks!</h1>
      <p class="lead" id="body"></p>
      <div class="btns"><a class="btn" href="index.html">Back to home</a></div>
      <div id="scheduler" class="embed" hidden></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year">2026</span> Ankit Agrawal(Kit)</span>
    <a href="index.html">← Back to home</a>
  </div>
</footer>

<script src="config.js"></script>
<script src="site.js"></script>
<script>
(function () {
  const { cfg, isSet, embed } = window.Site;
  const type = new URLSearchParams(location.search).get('type');
  const $ = id => document.getElementById(id);

  if (type === 'consult') {
    $('kicker').textContent = 'Payment received';
    $('title').textContent = 'Now pick a time that works for you.';
    if (isSet(cfg.schedulerUrl)) {
      $('body').textContent = 'Thanks for your payment. Choose a slot below and you will get a calendar invite by email.';
      embed($('scheduler'), cfg.schedulerUrl);
      $('scheduler').hidden = false;
    } else {
      $('body').textContent = 'Thanks for your payment. I will email you shortly to arrange a time.';
    }
  } else if (type === 'newsletter') {
    $('kicker').textContent = 'Welcome aboard';
    $('title').textContent = "You're subscribed.";
    $('body').textContent = 'Thanks for joining. Your subscription renews monthly until you cancel, and Stripe will email you a receipt each time.';
    if (isSet(cfg.newsletter && cfg.newsletter.manageUrl)) {
      const a = document.createElement('a');
      a.className = 'btn'; a.rel = 'noopener'; a.href = cfg.newsletter.manageUrl; a.textContent = 'Manage or cancel subscription';
      document.querySelector('.btns').appendChild(a);
    }
    // Tell the sheet the visitor came back from checkout (informational; Stripe is the source of truth for payments).
    let email = null;
    try { email = sessionStorage.getItem('subEmail'); sessionStorage.removeItem('subEmail'); } catch (e) {}
    if (email && isSet(cfg.signupEndpoint)) {
      fetch(cfg.signupEndpoint, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'returned_from_checkout', email: email })
      }).catch(() => {});
    }
  } else {
    $('title').textContent = 'Thanks for stopping by.';
    $('body').textContent = 'Nothing to see here. Head back home to keep exploring.';
  }
})();
</script>
</body>
</html>
